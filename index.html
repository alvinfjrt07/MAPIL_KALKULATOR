<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Sederhana</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #e0f7fa, #f5f5f5);
        font-family: Arial, sans-serif;
      }

      .calculator {
        width: 320px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 16px 30px rgba(0, 0, 0, 0.12);
        padding: 20px;
      }

      .display {
        width: 100%;
        height: 70px;
        border: none;
        border-radius: 12px;
        background: #f3f4f6;
        text-align: right;
        font-size: 2rem;
        padding: 0 16px;
        margin-bottom: 16px;
        color: #1f2937;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 12px;
        height: 58px;
        font-size: 1.5rem;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.95;
      }

      button:active {
        transform: scale(0.98);
      }

      .number {
        background: #e5e7eb;
        color: #111827;
      }

      .operator {
        background: #f59e0b;
        color: white;
      }

      .gray {
        background: #d1d5db;
        color: #111827;
      }

      .equal {
        background: #10b981;
        color: white;
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <input id="display" class="display" type="text" value="0" readonly />

      <div class="buttons">
        <button class="gray" data-action="clear">C</button>
        <button class="gray" data-action="delete"><</button>
        <button class="operator" data-value="/">/</button>
        <button class="operator" data-value="*">×</button>

        <button class="number" data-value="7">7</button>
        <button class="number" data-value="8">8</button>
        <button class="number" data-value="9">9</button>
        <button class="operator" data-value="-">−</button>

        <button class="number" data-value="4">4</button>
        <button class="number" data-value="5">5</button>
        <button class="number" data-value="6">6</button>
        <button class="operator" data-value="+">+</button>

        <button class="number" data-value="1">1</button>
        <button class="number" data-value="2">2</button>
        <button class="number" data-value="3">3</button>
        <button class="equal" data-action="calculate">=</button>

        <button class="number" data-value="0" style="grid-column: span 2">
          0
        </button>
        <button class="number" data-value=".">.</button>
      </div>
    </div>

    <script src="./kalkulator.js"></script>
  </body>
</html>
